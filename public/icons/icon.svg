<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rejseappens ikon: en kuffert på en rute-streg hen over en globus.
       Kilde til PNG-ikonerne i denne mappe. Alt vigtigt ligger inden for
       "safe zone" (cirkel med radius 40 % af bredden), så ikonet også kan
       bruges som maskable på Android. -->
  <defs>
    <clipPath id="globe">
      <circle cx="256" cy="256" r="160" />
    </clipPath>
    <radialGradient id="ocean" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0c4a6e" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#0f172a" />

  <!-- Globus -->
  <circle cx="256" cy="256" r="160" fill="url(#ocean)" />
  <g clip-path="url(#globe)" fill="none" stroke="#e0f2fe" stroke-opacity="0.3" stroke-width="4">
    <ellipse cx="256" cy="256" rx="60" ry="160" />
    <ellipse cx="256" cy="256" rx="120" ry="160" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <path d="M110 186 Q256 206 402 186 M110 326 Q256 306 402 326" />
  </g>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e0f2fe" stroke-opacity="0.5" stroke-width="5" />

  <!-- Rute: prikket bue med start- og slutpunkt -->
  <path d="M138 340 Q226 170 388 210" fill="none" stroke="#facc15" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="0.1 26" />
  <circle cx="138" cy="340" r="13" fill="#facc15" stroke="#0f172a" stroke-width="5" />
  <circle cx="388" cy="210" r="15" fill="#f43f5e" stroke="#0f172a" stroke-width="5" />

  <!-- Kuffert, der står på ruten -->
  <g stroke="#0f172a" stroke-width="7" stroke-linejoin="round">
    <path d="M226 180 v-18 a10 10 0 0 1 10 -10 h40 a10 10 0 0 1 10 10 v18"
          fill="none" stroke="#f1f5f9" stroke-width="9" stroke-linecap="round" />
    <rect x="186" y="178" width="140" height="96" rx="16" fill="#f59e0b" />
    <line x1="220" y1="180" x2="220" y2="272" stroke="#b45309" stroke-width="9" />
    <line x1="292" y1="180" x2="292" y2="272" stroke="#b45309" stroke-width="9" />
    <circle cx="210" cy="282" r="9" fill="#f1f5f9" />
    <circle cx="302" cy="282" r="9" fill="#f1f5f9" />
  </g>
</svg>
